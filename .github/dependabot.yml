# Gerado por _shared/workspace/ci/gerar_guard_e_dependabot.py
version: 2
updates:
  - package-ecosystem: pip
    directory: "/backend"
    versioning-strategy: increase-if-necessary
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      menores:
        update-types: [minor, patch]
    # major quebra demo (ex.: langfuse>=3 quebra em silêncio; regra do workspace pina <3): decisão manual
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: "/"
    versioning-strategy: increase-if-necessary
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      menores:
        update-types: [minor, patch]
    # major quebra demo (ex.: langfuse>=3 quebra em silêncio; regra do workspace pina <3): decisão manual
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: "/frontend"
    versioning-strategy: increase-if-necessary
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      menores:
        update-types: [minor, patch]
    # major quebra demo (ex.: langfuse>=3 quebra em silêncio; regra do workspace pina <3): decisão manual
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
