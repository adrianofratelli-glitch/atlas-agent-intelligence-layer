name: CI

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      POV_SHARED_DEPLOY_KEY: ${{ secrets.POV_SHARED_DEPLOY_KEY }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: pov-shared (lib privada; só roda com o secret POV_SHARED_DEPLOY_KEY)
        if: env.POV_SHARED_DEPLOY_KEY != ''
        uses: actions/checkout@v7
        with:
          repository: adrianofratelli-glitch/pov-shared
          ssh-key: ${{ secrets.POV_SHARED_DEPLOY_KEY }}
          path: .pov-shared
      - name: instala pov-shared
        if: env.POV_SHARED_DEPLOY_KEY != ''
        run: pip install -e "$GITHUB_WORKSPACE/.pov-shared[llm,tracing]"
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run build
